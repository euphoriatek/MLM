<p-table #dt [value]="withdrawals" dataKey="id" styleClass="p-datatable-customers" [rowHover]="true" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50]" [paginator]="true" currentPageReportTemplate=""
    [filterDelay]="0" [globalFilterFields]="['username','account_holder_name','bank_name','amount']">
    <ng-template pTemplate="caption">
        <div class="table-header mb-4">
            <h3>Withdrawal List</h3>
            <div>
                <span class="p-input-icon-left">
                    <i class="ti ti-search"></i>
                    <input class="form-control" InputText type="text" (input)="applyFilterGlobal($event, 'contains')"
                        placeholder="Global Search" />
                </span>
            </div>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="created_at">Date<p-sortIcon field="created_at"></p-sortIcon></th>
            <th pSortableColumn="amount">Withdrawal Amount<p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="amount">TDS<p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="amount">Net Payable<p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="status">Status<p-sortIcon field="amount"></p-sortIcon></th>
            <th>View</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data>
        <tr class="p-selectable-row">
            <td>
                <span class="p-column-title">Date</span>
                <span class="image-text">{{data.created_at | date}}</span>
            </td>
            <td>
                <span class="p-column-title">Withdrawal Amount</span>
                <span class="image-text">{{data.price}}</span>
            </td>
            <td>
                <span class="p-column-title">Bank Name</span>
                <span class="image-text">{{data.bank_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Amount</span>
                <span class="image-text">{{data.price}}</span>
            </td>
        
            <td>
                <span class="p-column-title">Status</span>
                <span class="image-text">{{ data.status}}</span>
            </td>
            <td>
                <div class="d-flex">
                    <button class="btn editbtn" (click)="viewDialog()" title="view">View</button>
               
                  </div>
            </td>
        </tr>
    </ng-template>
</p-table>
