<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">

      <div class="card">
        <div class="auth-header text-center mb-4">
          <img src="assets/images/sklife-logo-black.svg" alt="logo" />
        </div>
        <div class="card-body p-0">
          <div class="d-flex justify-content-center align-items-end mb-4">
            <h3 class="mb-0">Forgot Password</h3>
          </div>
          <form method="post" (ngSubmit)="sendOtp()" [formGroup]="forgetPassword">
            <div class="form-group mb-3">
              <label class="form-label" for="mobile_no">Mobile No</label>
              <div class="form-input">
                <img src="assets/images/admin_images/icons/phone.png" alt="mobile_number" />
                <input formControlName="mobile_number" type="text" class="form-control" id="mobile_number"
                  placeholder="Mobile No" />
              </div>

              <div *ngIf="
                forgetPassword?.get('mobile_number')?.hasError('required') &&
                forgetPassword?.get('mobile_number')?.touched">
                <span class="error-message">Mobile Number is Required</span>
              </div>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-dark">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<p-dialog id="dialog" header="Verify OTP" [(visible)]="visible" [style]="{ 'max-width': '580px', 'width':'100%'}"
  [modal]="true">
  <div>
    <form method="post" (ngSubmit)="verifyOtp()" [formGroup]="otpForm">
      <div class="form-group mb-3">
        <label class="form-label" for="mobile_no">Mobile No</label>
        <div class="form-input">
          <!-- <img src="assets/images/admin_images/icons/phone.png" alt="otp" /> -->
          <input formControlName="otp" type="text" class="form-control" id="otp" placeholder="Mobile No" />
        </div>

        <div *ngIf="
            otpForm?.get('otp')?.hasError('required') &&
            otpForm?.get('otp')?.touched">
          <span class="error-message">OTP is Required</span>
        </div>
      </div>
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-dark">Verify</button>
      </div>
    </form>
  </div>
</p-dialog>
<p-dialog id="dialog" header="Reset Password" [(visible)]="resetPassword"
  [style]="{ 'max-width': '580px', 'width':'100%'}" [modal]="true">
  <div>
    <form method="post" (ngSubmit)="resetPasswords()" [formGroup]="passwords">
      <div class="col-lg-12">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="password" class="form-control" formControlName="password">
          <div *ngIf=" passwords.get('password')?.touched && passwords.get('password')?.invalid  ">
            <small class="text-danger" *ngIf=" passwords.get('password')?.hasError('required') ">Password is
              Required. </small>
          </div>
        </div>

      </div>
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary">Change</button>
      </div>
    </form>
  </div>
</p-dialog>
