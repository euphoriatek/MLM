<p-table #dt [value]="withdrawals" dataKey="id" styleClass="p-datatable-customers" [rowHover]="true" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50]" [paginator]="true" currentPageReportTemplate=""
    [filterDelay]="0" [globalFilterFields]="['username','account_holder_name','bank_name','amount']">
    <ng-template pTemplate="caption">
        <div class="table-header mb-4">
            <h3>Withdrawal List</h3>
            <div class="product-search">
                <span class="p-input-icon-left w-100">
                    <i class="ti ti-search"></i>
                    <input class="form-control" InputText type="text" (input)="applyFilterGlobal($event, 'contains')"
                        placeholder="Global Search" />
                </span>
            </div>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <!-- <th pSortableColumn="id">Id<p-sortIcon field="id"></p-sortIcon></th> -->
            <th pSortableColumn="username">Username <p-sortIcon field="username"></p-sortIcon></th>
            <th pSortableColumn="account_holder_name">Account Holder Name<p-sortIcon field="account_holder_name"></p-sortIcon></th>
            <th pSortableColumn="bank_name">Bank Name<p-sortIcon field="bank_name"></p-sortIcon></th>
            <th pSortableColumn="amount">Amount<p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="created_at">Created At <p-sortIcon field="created_at"></p-sortIcon></th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data>
        <tr class="p-selectable-row">
            <!-- <td>
                <span class="p-column-title">S.No.</span>
                <span class="image-text">{{data.id}}</span>
            </td> -->
            <td>
                <span class="p-column-title">Username</span>
                <span class="image-text">{{data.user.full_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Account Holdern Name</span>
                <span class="image-text">{{data.account_holder_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Bank Name</span>
                <span class="image-text">{{data.bank_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Amount</span>
                <span class="image-text">{{data.price}}</span>
            </td>
            <td>
                <span class="p-column-title">Created At</span>
                <span class="image-text">{{ data.created_at | date }}</span>
            </td>
            <td>
                <span class="p-column-title">Status</span>
                <span class="image-text">{{ data.status}}</span>
            </td>
            <td>
                <div class="d-flex">
                    <button class="btn editbtn" (click)="approved(data)" [disabled]="data.status === 'approved' || data.status === 'rejected'">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <button class="btn deletebtn" (click)="reject(data)" [disabled]="data.status === 'approved' || data.status === 'rejected'">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
