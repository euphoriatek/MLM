<p-table #dt [value]="transactions" dataKey="id" styleClass="p-datatable-customers" [rowHover]="true" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50]" [paginator]="true"
    currentPageReportTemplate="" [filterDelay]="0"
    [globalFilterFields]="['username','total_price','commission_amount','created_at']">
    <ng-template pTemplate="caption">
        <div class="table-header mb-4">
            <h3>Transactions List</h3>
            <div class="product-search">
                <span class="p-input-icon-left w-100">
                    <i class="ti ti-search"></i>
                    <input class="form-control" InputText type="text" (input)="applyFilterGlobal($event, 'contains')"
                        placeholder="Global Search" />
                </span>
            </div>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <!-- <th pSortableColumn="id">Id<p-sortIcon field="id"></p-sortIcon></th>
            <th pSortableColumn="product_name">Product Name<p-sortIcon field="product_name"></p-sortIcon></th>
            <th pSortableColumn="quantity">Quantity<p-sortIcon field="quantity"></p-sortIcon></th> -->
            <th pSortableColumn="username">Username <p-sortIcon field="username"></p-sortIcon></th>
            <th pSortableColumn="total_price">Total Price<p-sortIcon field="total_price"></p-sortIcon></th>
            <th pSortableColumn="commission_amount">Commission Amount<p-sortIcon field="commission_amount"></p-sortIcon></th>
            <th pSortableColumn="created_at">Created At <p-sortIcon field="created_at"></p-sortIcon></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data>
        <tr class="p-selectable-row">
            <!-- <td>
                <span class="p-column-title">S.No.</span>
                <span class="image-text">{{data.id}}</span>
            </td>
            <td>
                <span class="p-column-title">Product Name</span>
                <span class="image-text">{{data.product_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Quantity</span>
                <span class="image-text">{{data.quantity}}</span>
            </td> -->
            <td>
                <span class="p-column-title">Username</span>
                <span class="image-text">{{data.user.full_name}}</span>
            </td>
            <td>
                <span class="p-column-title">Total Price</span>
                <span class="image-text">{{data.total_price}}</span>
            </td>
            <td>
                <span class="p-column-title">Commission Amount</span>
                <span class="image-text">{{data.commission_amount}}</span>
            </td> 
            <td>
                <span class="p-column-title">created_at</span>
                <span class="image-text">{{ data.created_at | date }}</span>
            </td>
        </tr>
    </ng-template>
</p-table>
