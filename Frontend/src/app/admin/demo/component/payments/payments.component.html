<p-table #dt [value]="payments" dataKey="id" styleClass="p-datatable-customers" [rowHover]="true" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50]" [paginator]="true"
    currentPageReportTemplate="" [filterDelay]="0"
    [globalFilterFields]="['email','r_payment_id','method','currency','amount','created_at']">
    <ng-template pTemplate="caption">
        <div class="table-header mb-4">
            <h3>Payments List</h3>
            <div>
                <span class="p-input-icon-left">
                    <i class="ti ti-search"></i>
                    <input class="form-control" InputText type="text" (input)="applyFilterGlobal($event, 'contains')"
                        placeholder="Global Search" />
                </span>
            </div>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="id">Id<p-sortIcon field="id"></p-sortIcon></th>
            <th pSortableColumn="email">Email<p-sortIcon field="email"></p-sortIcon></th>
            <th pSortableColumn="r_payment_id">Transaction Id<p-sortIcon field="quantity"></p-sortIcon></th>
            <th pSortableColumn="method">Method<p-sortIcon field="total_price"></p-sortIcon></th>
            <th pSortableColumn="currency">Currency<p-sortIcon field="currency"></p-sortIcon></th>
            <th pSortableColumn="amount">Amount<p-sortIcon field="amount"></p-sortIcon></th>
            <th pSortableColumn="created_at">Created At <p-sortIcon field="created_at"></p-sortIcon></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data>
        <tr class="p-selectable-row">
            <td>
                <span class="p-column-title">S.No.</span>
                <span class="image-text">{{data.id}}</span>
            </td>
            <td>
                <span class="p-column-title">Email</span>
                <span class="image-text">{{data.user_email}}</span>
            </td>
            <td>
                <span class="p-column-title">Transaction Id</span>
                <span class="image-text">{{data.r_payment_id}}</span>
            </td>
            <td>
                <span class="p-column-title">Method</span>
                <span class="image-text">{{data.method}}</span>
            </td>
            <td>
                <span class="p-column-title">Currency</span>
                <span class="image-text">{{data.currency}}</span>
            </td>
            <td>
                <span class="p-column-title">Amount</span>
                <span class="image-text">{{data.amount}}</span>
            </td>
            <td>
                <span class="p-column-title">created_at</span>
                <span class="image-text">{{ data.created_at | date }}</span>
            </td>
        </tr>
    </ng-template>
</p-table>
