<form action="" [formGroup]="productForm" (ngSubmit)="addProduct()">
    <!-- Product Name -->
    <div class="col-lg-8">
        <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" formControlName="name" class="form-control" />
            <div *ngIf="productForm.get('name').hasError('required') && productForm.get('name').touched">
                <span class="error-message">Product name is required</span>
            </div>
        </div>
    </div>
  
    <!-- Price -->
    <div class="col-lg-8">
        <div class="form-group">
            <label for="price">Price</label>
            <input type="text" id="price" formControlName="price" class="form-control" />
            <div *ngIf="productForm.get('price').hasError('required') && productForm.get('price').touched">
                <span class="error-message">Price is required</span>
            </div>
        </div>
    </div>
  
    <!-- DP (Discount Price) -->
    <div class="col-lg-8">
        <div class="form-group">
            <label for="dp">DP (Discount Price)</label>
            <input type="text" id="dp" formControlName="dp" class="form-control" />
            <div *ngIf="productForm.get('dp').hasError('required') && productForm.get('dp').touched">
                <span class="error-message">Discount Price is required</span>
            </div>
        </div>
    </div>
  
    <!-- PV (Bonus Value) -->
    <div class="col-lg-8">
        <div class="form-group">
            <label for="pv">BV (Bonus Value)</label>
            <input type="text" id="pv" formControlName="pv" class="form-control" />
            <div *ngIf="productForm.get('pv').hasError('required') && productForm.get('pv').touched">
                <span class="error-message">Bonus Value is required</span>
            </div>
        </div>
    </div>
  
    <!-- Category -->
    <div class="col-lg-8">
        <div class="form-group">
            <label>Category</label>
            <div class="category-options">
                <input type="radio" formControlName="category" value="1" id="healthcare" />
                <label for="healthcare">Health Care</label>

                <input type="radio" formControlName="category" value="2" id="personalcare" />
                <label for="personalcare">Personal Care</label>

                <input type="radio" formControlName="category" value="3" id="homecare" />
                <label for="homecare">Home Care</label>

                <input type="radio" formControlName="category" value="4" id="agriculture" />
                <label for="agriculture">Agriculture</label>
            </div>
        </div>
    </div>
  
    <!-- Product Description -->
    <div class="col-lg-8">
        <div class="form-group">
            <label for="description">Product Description</label>
            <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
            <div *ngIf="productForm.get('description').hasError('required') && productForm.get('description').touched">
                <span class="error-message">Description is required</span>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label for="image">product image</label>
        <input type="file" class="form-control" (change)="onFileChange($event)" #fileInput />
        <div *ngIf="imageUrl" class="mt-3">
            <img [src]="imageUrl" style="max-width: 150px; max-height: 150px;" alt="Lead Image" class="img-thumbnail" />
          </div>  
        <div *ngIf="productForm?.get('image')?.hasError('required') && productForm?.get('image')?.touched">
            <span class="error-message">image required</span>
        </div>
    </div>

    <div class="col-lg-12">
        <div class="form-group">
            <div class="d-flex gap-2 from-button">
                <input type="submit" class="btn orange-btn" value="Save">
                <input (click)="resetForm()" type="button" class="btn grey-btn" value="Reset">
            </div>
          </div>
    </div>
</form>
