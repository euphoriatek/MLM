<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      
      <div class="card">
        <div class="auth-header text-center mb-4">
          <img src="assets/images/admin_images/admin-logo.png" alt="logo" />
        </div>
        <div class="card-body p-0">
          <div class="d-flex justify-content-center align-items-end mb-4">
            <h3 class="mb-0">Admin Login</h3>
          </div>
          <form method="post" (ngSubmit)="Login()" [formGroup]="LoginForm">
            <div class="form-group mb-3">
              <label class="form-label" for="mobile_no">Mobile No</label>
              <div class="form-input">
                <img src="assets/images/admin_images/icons/phone.png" alt="email" />
                <input formControlName="mobile_no" type="text" class="form-control" id="mobile_no" placeholder="Mobile No" />
              </div>
             
              <div *ngIf="
                LoginForm?.get('mobile_no')?.hasError('required') &&
                LoginForm?.get('mobile_no')?.touched">
                <span class="error-message">User name is required</span>
              </div>
            </div>
            <div class="form-group mb-3">
              <label class="form-label" for="password">Password</label>
              <div class="form-input">
                <img src="assets/images/admin_images/lock.svg" alt="lock" />
              <!-- <input formControlName="password" type="password" class="form-control" id="password"
                placeholder="password" value="" /> -->
                <input formControlName="password" [type]="passwordFieldType" class="form-control" id="password"
                placeholder="password" />
                <!-- Eye Slash Icon (When password is hidden) -->
                <i *ngIf="passwordFieldType === 'password'" class="fa fa-eye-slash toggle-password"
                  (click)="togglePasswordVisibility()" aria-hidden="true"></i>

                <!-- Eye Icon (When password is visible) -->
                <i *ngIf="passwordFieldType === 'text'" class="fa-solid fa-eye toggle-password"
                  (click)="togglePasswordVisibility()"></i>

                 <!-- <i class="fa-solid fa-eye toggle-password" (click)="togglePasswordVisibility()"></i> -->
              </div>
              <div *ngIf="
              LoginForm?.get('password')?.hasError('required') &&
              LoginForm?.get('password')?.touched">
                <span class="error-message">Password is required</span>
              </div>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
        </div>
      </div>
    
    </div>
  </div>
</div>
